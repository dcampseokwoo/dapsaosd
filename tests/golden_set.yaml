# US FORGED 후보 선별 엔진 — 회귀 테스트 골든셋
#
# 사용법: tests/golden_set.yaml 로 배치하고 pytest fixture로 로드한다.
# 새 오류를 발견할 때마다 여기에 한 줄씩 추가한다.
#
# ⚠ fixture 수정 원칙 (반드시 지킬 것):
#   fixture 를 '출력과 일치하도록' 반복 수정하면 테스트가 아니라 출력의 거울이 된다.
#   → fixture 수정은 **DB 원문(1줄 소개·기술 컬럼)에 명시적 근거가 있을 때만** 허용한다.
#     (예: 자이스웍스='intelligent control services', 크레신 기술컬럼='OEM·ODM' — 라벨이
#      아니라 원문이 SW/수탁임을 증명.)
#   → 원문 근거 없이 분류기 출력과 안 맞으면, fixture 를 고치지 말고 **프롬프트를 고친다**.
#   이 원칙을 어긴 수정은 커밋에서 거부한다.
#
# 레이어를 분리한 이유:
#   - classification_*  는 "이 회사가 하드테크인가" 만 검증한다. 스테이지와 무관하다.
#   - stage_rules       는 스테이지 필터만 검증한다.
#   - end_to_end        는 최종 파이프라인을 검증한다.
# 스테이지 값은 DB 스냅샷마다 바뀌므로(18시간 만에 652곳 변동) 섞어서 테스트하면 안 된다.

meta:
  # ⚠ 아래 스냅샷 정보는 '참고값'이지 테스트 assertion 이 아니다.
  #    이 DB는 살아있는 구글 시트에서 export되며 하루 사이에도 스테이지가 수백 건 바뀐다.
  #    골든셋은 스냅샷에 의존하지 않아야 한다:
  #      - 기업 식별은 biz_no 로 한다 (사명 변경·중복에 강함)
  #      - classification_* 는 스테이지와 무관하게 항상 성립해야 한다
  #      - stage_rules 는 '값 → 버킷' 매핑만 검증한다. 특정 기업의 실제 스테이지 값을 하드코딩하지 않는다
  #    실행 시 사용한 스냅샷의 파일명·SHA256·행수·스테이지 분포를 리포트에 기록만 하고, 불일치를 실패로 처리하지 말 것.
  reference_snapshot: GBD_DB_20260818_1856.xlsx
  reference_sha256_prefix: "58941558719c663e"
  reference_rows: 3424
  reference_stage_dist: {Seed: 571, 알 수 없음: 568, Series A: 567, Pre-A: 376}
  note: 이 감사를 수행한 시점의 export 기준. 실제 사용 스냅샷과 다를 수 있으며, 다른 것이 정상이다.
  source: 엔진 출력 338개사를 원본 DB 전수와 대조한 감사 결과

# ─────────────────────────────────────────────────────────────
# 1. 분류기 검증 — hardtech 로 판정해야 하는 기업
#    (스테이지 무관. 분류 레이어만 본다)
# ─────────────────────────────────────────────────────────────
stage_rules:

  value_mapping:
    - {value: "Pre-seed",   expect: "IN_SCOPE"}
    - {value: "Angel",      expect: "IN_SCOPE"}
    - {value: "Seed",       expect: "IN_SCOPE"}
    - {value: "알 수 없음",  expect: "UNKNOWN"}
    - {value: null,         expect: "UNKNOWN"}
    - {value: "Pre-A",      expect: "EXCEPTION"}
    - {value: "Series A",   expect: "OUT_OF_SCOPE"}
    - {value: "Pre-B",      expect: "OUT_OF_SCOPE"}
    - {value: "Series B",   expect: "OUT_OF_SCOPE"}
    - {value: "Series C",   expect: "OUT_OF_SCOPE"}
    - {value: "Series D",   expect: "OUT_OF_SCOPE"}
    - {value: "Series E ~", expect: "OUT_OF_SCOPE"}
    - {value: "Pre-IPO",    expect: "OUT_OF_SCOPE"}
    - {value: "IPO('24)",   expect: "OUT_OF_SCOPE"}
    - {value: "M&A('23)",   expect: "OUT_OF_SCOPE"}
    - {value: "존재하지_않는_값", expect: "RAISE"}   # 조용히 탈락시키지 말고 예외를 던질 것

  pre_a_exception:
    # Pre-A + 타겟국가에 미국 + physical_product == true → stage_exception 버킷
    - name: "메디띵스"
      biz_no: "363-88-01795"
      note: "NIRS 방광 모니터링 웨어러블. 타겟국가 미국. 신규 스냅샷에서 Series A로 변경되었을 수 있으니 스냅샷 값을 확인할 것"
      expect_bucket: "stage_exception_or_out_of_scope"
    - name: "아폴론"
      biz_no: "661-81-02253"
      note: "무채혈 CGM 디바이스. 타겟국가 미국. Pre-A"
      expect_bucket: "stage_exception"
    - name: "리옵스"
      biz_no: "463-81-03056"
      note: |
        이전 스냅샷 Seed → 신규 스냅샷 Pre-A. 타겟국가 미국, 실리콘밸리 프로그램 참여 이력 보유.
        제조 자동화용 RT3D 로보틱스. DB에서 미국 진출 의지가 확인되는 극소수 하드테크 기업이므로
        스테이지 변경만으로 조용히 사라지면 안 된다.
      expect_bucket: "stage_exception"

# ─────────────────────────────────────────────────────────────
# 4. 중복 엔티티 처리 검증
#
# 병합 전 '신원 판정'을 먼저 한다(fixture 오류 교정 2026-08-19):
#   1) 둘 다 유효 사업자번호이고 서로 다르면 → 별개 엔티티(name_collision). 병합 금지.
#   2) 한쪽만 유효 → 유효한 쪽이 정본. 결측 행 값은 참고만, 정본을 덮어쓰지 않음.
#   3) 같은 사업자번호가 여러 행 → 진짜 중복. 여기서만 보수적 병합(스테이지 충돌 시 후기).
# ─────────────────────────────────────────────────────────────
duplicate_entities:
  - name: "한국공장지붕태양광지주"
    expect: name_collision            # 둘 다 유효+상이 → 병합 아님, 각각 독립 판정
    entities:
      - {biz_no: "727-81-02043", stage: "Series C",   expect_final: "excluded"}
      - {biz_no: "597-88-01495", stage: "알 수 없음",  expect_final: "to_classification"}
    note: "과거 '알 수 없음' 행을 집어 통과시킨 건 병합 버그. 실제로는 별개 엔티티 2개이며 Series C 쪽만 배제된다."

  - name: "알피"
    expect: name_collision
    suspect: different_industry        # 업종이 크게 달라 동명이인 의심
    entities:
      - {biz_no: "515-81-40648", stage: "Pre-IPO", industry: "Hardware; Manufacturing; Science and Engineering; Sustainability", expect_final: "excluded"}
      - {biz_no: "821-86-02087", stage: "Pre-A",   industry: "Healthcare", expect_final: "excluded"}
    note: "둘 다 유효+상이. 병합하면 존재하지 않는 회사를 만든다. 두 엔티티 모두 스테이지 이탈로 배제."

  - name: "딥메트릭스"
    expect: canonical_valid            # 한쪽만 유효 → 유효 행이 정본
    canonical_biz_no: "855-88-01407"
    canonical_stage: "Seed"
    note: "결측 biz_no 행(Series A)은 보조 정보로만. 정본(Seed)을 덮어쓰지 않는다."

  - name: "오믈렛"
    expect: name_collision
    suspect: similar_biz_no            # 데이터 확인: 23981 vs 02981 은 순수 전치가 아니라 2자리 치환. 근접 유사로 플래그
    entities:
      - {biz_no: "563-88-23981", stage_after_merge: "Pre-A", note: "같은 번호 2행(Seed+Pre-A) → 보수적 병합으로 Pre-A"}
      - {biz_no: "563-88-02981", stage: "Pre-A"}
    similar_pair: ["563-88-23981", "563-88-02981"]
    action: report_no_auto_merge       # 자동 병합 금지, 리포트에 남겨 사람이 확인


malformed_biz_no:
  - {name: "랜딩", value: "725-870-2428", note: "하이픈 위치 오류. 정규화 후 경고 리포트에 포함할 것"}
  - {name: "스피드플로어", value: "103-87-02332 ", note: "앞뒤 공백 포함"}

