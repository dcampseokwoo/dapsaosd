  - id: legacy_label_not_zero
    desc: "초기단계 기업 중 한글 레거시 업종 라벨(소재/부품/장비, 기후테크, IT서비스/솔루션, 컨텐츠/소비재, 바이오/헬스케어) 보유 기업의 통과율이 0%가 아닐 것"
